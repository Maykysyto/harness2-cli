name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true
      - name: Install
        run: uv pip install -e . -e plugins/harness2-benchmarks
      - name: Core tests
        run: python -B -m unittest discover -s tests
      - name: Plugin tests
        run: python -B -m unittest discover -s plugins/harness2-benchmarks/tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check harness2 tests plugins
      - run: uvx ruff format --check harness2 tests plugins

  pi-runtime:
    name: Pi Durable host (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix pi-runtime
      - run: npm test --prefix pi-runtime
